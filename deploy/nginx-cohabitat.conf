# Include inside the existing sanliang.online HTTPS server block.
# Keep all existing site locations unchanged. Test with nginx -t before reloading.
location = /cohabitat { return 308 /cohabitat/; }
location ^~ /cohabitat/ {
    proxy_pass http://127.0.0.1:5321/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    client_max_body_size 24k;
}
